modelRoles:
  default: openai-codex/gpt-6-astra:high
  task: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-6-sol
  slow: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
symbolPreset: unicode
composer:
  shape: claude
theme:
  dark: titanium
setupVersion: 2
defaultThinkingLevel: medium
tools:
  approvalMode: yolo
compaction:
  thresholdTokens: 120000
  thresholdPercent: 95
  methodOrder:
    - remote
    - handoff
    - shake
    - soft
goal:
  enabled: true
task:
  maxConcurrency: 6
  agentModelOverrides:
    plan-codex: openai-codex/gpt-6-astra:high
    plan-claude: openai-codex/gpt-6-sol:high
    implementer: openai-codex/gpt-6-sol:medium  # only drives the Claude Code CLI; Claude writes the code
    astra-high-review: openai-codex/gpt-6-astra:high
    reviewer: openai-codex/gpt-6-astra:high
    security-reviewer: openai-codex/gpt-6-astra:high
    scout: openai-codex/gpt-6-sol
    sonic: openai-codex/gpt-6-sol
github:
  enabled: true
statusLine:
  preset: custom
  leftSegments:
    - path
    - git
  rightSegments:
    - token_total
dev:
  autoqaConsent: granted
telemetry:
  otlpExportEnabled: false