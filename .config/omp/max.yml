# Hard-problem overlay. Bumps every reasoning stage to max effort on both
# vendors, leaving the cheap bulk tiers alone.
#
#   omp --config ~/.omp/agent/max.yml
#
# Loaded per run, so it never leaks into normal work.
modelRoles:
  default: openai-codex/gpt-6-astra:max
  slow: openai-codex/gpt-6-astra:max
  plan: openai-codex/gpt-6-astra:max
  # Subagents still default to terra; the roles below are what actually think.
defaultThinkingLevel: max
task:
  agentModelOverrides:
    plan-codex: openai-codex/gpt-6-astra:max
    plan-claude: openai-codex/gpt-6-sol:max
    implementer: openai-codex/gpt-6-sol:max
    astra-high-review: openai-codex/gpt-6-astra:max
    reviewer: openai-codex/gpt-6-astra:max
    security-reviewer: openai-codex/gpt-6-astra:max
    # Deliberately unchanged: research and mechanical edits gain nothing from
    # max effort and it is the bulk of the token spend.
    scout: openai-codex/gpt-6-sol
    sonic: openai-codex/gpt-6-sol
