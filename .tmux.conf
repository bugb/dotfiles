## Mouse / scrollback
set -g mouse on
set -g history-limit 50000

# Wheel on the alternate screen (less, man, vim) sends arrow keys instead of
# entering copy-mode, so pagers scroll natively.
bind -n WheelUpPane if -Ft= '#{mouse_any_flag}' 'send -M' \
  'if -Ft= "#{pane_in_mode}" "send -M" "copy-mode -e; send -M"'
bind -n WheelDownPane if -Ft= '#{mouse_any_flag}' 'send -M' 'send -Mt='

# Drag-select copies and leaves copy-mode at the bottom (no sticky scrollback).
set -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

## Terminal capabilities (truecolor + OSC 52 clipboard through mosh)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,alacritty:Tc,*:RGB"
set -g set-clipboard on
set -s escape-time 10
set -g focus-events on
